<script src="report-data.js"></script><script src="report-app.js"></script><script id="authGateScript">
(() => {
  const AUTH_HASH = "576077e8597c153464386486162997be28ff4cd6c15f91baa25705051c83cf48";
  const form = document.getElementById("authForm");
  if (!form) return;
  const input = document.getElementById("authPassword");
  const error = document.getElementById("authError");
  const submit = document.getElementById("authSubmit");
  const toHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  async function sha256(text) { return toHex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text))); }
  function unlock() {
    try { sessionStorage.setItem(window.__luuxAuthKey, "verified"); } catch (e) {}
    document.documentElement.classList.add("auth-ok");
    document.getElementById("authGate").setAttribute("aria-hidden", "true");
    input.value = "";
    error.textContent = "";
  }
  input.addEventListener("input", () => { error.textContent = ""; });
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!input.value) { error.textContent = "비밀번호를 입력해주세요."; input.focus(); return; }
    submit.disabled = true;
    try {
      if (await sha256(input.value) === AUTH_HASH) unlock();
      else { error.textContent = "비밀번호가 올바르지 않습니다."; input.select(); }
    } catch (e) {
      error.textContent = "이 브라우저에서는 인증 기능을 사용할 수 없습니다.";
    } finally { submit.disabled = false; }
  });
  if (document.documentElement.classList.contains("auth-ok")) document.getElementById("authGate").setAttribute("aria-hidden", "true");
})();
</script>
