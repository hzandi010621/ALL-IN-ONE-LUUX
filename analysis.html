</style><script id="luuxAuthPrecheck">
(()=>{try{const prefix="luuxProtectedTab:";let tab=window.name.startsWith(prefix)?window.name.slice(prefix.length):"";if(!tab){tab=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);window.name=prefix+tab}window.__luuxAuthKey="luuxAuth:"+location.pathname+":"+tab;if(sessionStorage.getItem(window.__luuxAuthKey)==="verified")document.documentElement.classList.add("luux-auth-ok")}catch(e){}})();
</script></head><body id="top"><div id="luuxAuthGate" role="dialog" aria-modal="true" aria-labelledby="luuxAuthTitle"><form class="luux-auth-card" id="luuxAuthForm"><img class="luux-auth-logo" src="report-luux-logo.png" alt="LUUX"><div class="luux-auth-eyebrow">COMPETITIVE INTELLIGENCE</div><h1 id="luuxAuthTitle">경쟁매체 분석</h1><p class="luux-auth-desc">경쟁매체 집행 현황과 광고주·업종별 동향을 확인하세요. 비밀번호를 입력하면 분석 자료를 열람할 수 있습니다.</p><label class="luux-auth-label" for="luuxAuthPassword">비밀번호</label><div class="luux-auth-input-wrap"><input id="luuxAuthPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력" aria-describedby="luuxAuthError" autofocus><button id="luuxAuthToggle" type="button" aria-label="비밀번호 표시">보기</button></div><button id="luuxAuthSubmit" type="submit">접속하기</button><div id="luuxAuthError" role="alert" aria-live="polite"></div><p class="luux-auth-foot">새로고침 시에는 인증이 유지됩니다.<br>탭을 닫은 뒤 다시 접속하면 비밀번호를 다시 입력해야 합니다.</p><a class="luux-auth-home" href="index.html">← 홈으로 돌아가기</a></form></div>

<main><h1>analysis<span class="dot">.</span></h1>
<section class="rows" aria-label="경쟁매체 분석">

</section></main>

<script src="luux-viewer-controls.js?v=20261027-share-label"></script><script src="luux-share.js?v=20261027-share-label"></script><script src="luux-app-update.js?v=20261027-share-label"></script><script id="luuxAuthScript">
(() => {
  const AUTH_HASH = "576077e8597c153464386486162997be28ff4cd6c15f91baa25705051c83cf48";
  const form = document.getElementById("luuxAuthForm");
  if (!form) return;

  const input = document.getElementById("luuxAuthPassword");
  const error = document.getElementById("luuxAuthError");
  const submit = document.getElementById("luuxAuthSubmit");
  const toggle = document.getElementById("luuxAuthToggle");

  const toHex = buffer => Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return toHex(digest);
  }

  function unlock() {
    try {
      const key = window.__luuxAuthKey;
      if (key) sessionStorage.setItem(key, "verified");
    } catch (e) {}
    document.documentElement.classList.add("luux-auth-ok");
    document.getElementById("luuxAuthGate").setAttribute("aria-hidden", "true");
    const heading = document.querySelector("main h1");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
    input.value = "";
    error.textContent = "";
  }

  toggle.addEventListener("click", () => {
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    toggle.textContent = showing ? "보기" : "숨김";
    toggle.setAttribute("aria-label", showing ? "비밀번호 표시" : "비밀번호 숨기기");
    input.focus();
  });

  input.addEventListener("input", () => {
    input.removeAttribute("aria-invalid");
    error.textContent = "";
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!input.value) {
      input.setAttribute("aria-invalid", "true");
      error.textContent = "비밀번호를 입력해주세요.";
      input.focus();
      return;
    }
    submit.disabled = true;
    submit.textContent = "확인 중…";
    try {
      const hash = await sha256(input.value);
      if (hash === AUTH_HASH) {
        unlock();
      } else {
        input.setAttribute("aria-invalid", "true");
        error.textContent = "비밀번호가 올바르지 않습니다.";
        input.select();
      }
    } catch (e) {
      error.textContent = "이 브라우저에서는 인증 기능을 사용할 수 없습니다.";
    } finally {
      submit.disabled = false;
      submit.textContent = "접속하기";
    }
  });

  if (document.documentElement.classList.contains("luux-auth-ok")) {
    const gate = document.getElementById("luuxAuthGate");
    if (gate) gate.setAttribute("aria-hidden", "true");
  }
})();
</script></body></html>
