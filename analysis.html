</style><script id="luuxAuthPrecheck">

</script></head><body id="top"><div id="luuxAuthGate" role="dialog" aria-modal="true" aria-labelledby="luuxAuthTitle"><form class="luux-auth-card" id="luuxAuthForm"><div class="luux-auth-badge" aria-hidden="true"><img src="report-luux-logo.png" alt=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div><h1 id="luuxAuthTitle">접근 권한 확인</h1><p class="luux-auth-desc">해당 자료는 내부 공유용입니다.<br>비밀번호를 입력해주세요.</p><div class="luux-auth-input-wrap"><input id="luuxAuthPassword" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" aria-describedby="luuxAuthError" autofocus><button class="auth-toggle" id="luuxAuthToggle" type="button" aria-label="비밀번호 표시">보기</button></div><div id="luuxAuthError" role="alert" aria-live="polite"></div><div class="luux-auth-actions"><a class="luux-auth-cancel" href="index.html">취소</a><button id="luuxAuthSubmit" type="submit">확인</button></div></form></div>

<script src="luux-viewer-controls.js?v=20261027-luux-lock"></script><script src="luux-share.js?v=20261027-luux-lock"></script><script src="luux-app-update.js?v=20261027-luux-lock"></script><script id="luuxAuthScript">
(() => {
  const AUTH_HASH = "576077e8597c153464386486162997be28ff4cd6c15f91baa25705051c83cf48";
  const form = document.getElementById("luuxAuthForm");
  if (!form) return;

  const input = document.getElementById("luuxAuthPassword");
  const error = document.getElementById("luuxAuthError");
  const submit = document.getElementById("luuxAuthSubmit");
  const toggle = document.getElementById("luuxAuthToggle");

  const toHex = buffer => Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return toHex(digest);
  }

  function unlock() {
    try {
      const key = window.__luuxAuthKey;
      if (key) sessionStorage.setItem(key, "verified");
    } catch (e) {}
    document.documentElement.classList.add("luux-auth-ok");
    document.getElementById("luuxAuthGate").setAttribute("aria-hidden", "true");
    const heading = document.querySelector("main h1");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
    input.value = "";
    error.textContent = "";
  }

  toggle.addEventListener("click", () => {
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    toggle.textContent = showing ? "보기" : "숨김";
    toggle.setAttribute("aria-label", showing ? "비밀번호 표시" : "비밀번호 숨기기");
    input.focus();
  });

  input.addEventListener("input", () => {
    input.removeAttribute("aria-invalid");
    error.textContent = "";
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!input.value) {
      input.setAttribute("aria-invalid", "true");
      error.textContent = "비밀번호를 입력해주세요.";
      input.focus();
      return;
    }
    submit.disabled = true;
    submit.textContent = "확인 중…";
    try {
      const hash = await sha256(input.value);
      if (hash === AUTH_HASH) {
        unlock();
      } else {
        input.setAttribute("aria-invalid", "true");
        error.textContent = "비밀번호가 올바르지 않습니다.";
        input.select();
      }
    } catch (e) {
      error.textContent = "이 브라우저에서는 인증 기능을 사용할 수 없습니다.";
    } finally {
      submit.disabled = false;
      submit.textContent = "확인";
    }
  });

  if (document.documentElement.classList.contains("luux-auth-ok")) {
    const gate = document.getElementById("luuxAuthGate");
    if (gate) gate.setAttribute("aria-hidden", "true");
  }
})();
</script></body></html>
