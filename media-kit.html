  </main><footer><img src="landing-luux-logo.png" alt="LUUX"><a href="#top" aria-label="맨 위로">↑</a></footer><script>
    (() => {
      const pages = [...document.querySelectorAll('.page-wrap')];
      const currentPage = document.getElementById('currentPage');
      const progressBar = document.getElementById('progressBar');
      const zoomLabel = document.getElementById('zoomLabel');
      let zoom = 1;

      const updateProgress = () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
        progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
      };

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter(e => e.isIntersecting)
          .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) currentPage.textContent = visible.target.dataset.page;
      }, {
        root:null,
        threshold:[0.15,0.3,0.5,0.7]
      });

      pages.forEach(page => observer.observe(page));
      window.addEventListener('scroll', updateProgress, {passive:true});
      updateProgress();

      const applyZoom = () => {
        document.documentElement.style.setProperty('--zoom', zoom);
        zoomLabel.textContent = Math.round(zoom * 100) + '%';
      };

      document.getElementById('zoomIn').addEventListener('click', () => {
        zoom = Math.min(1.35, +(zoom + .1).toFixed(2));
        applyZoom();
      });
      document.getElementById('zoomOut').addEventListener('click', () => {
        zoom = Math.max(.7, +(zoom - .1).toFixed(2));
        applyZoom();
      });
      document.getElementById('goTop').addEventListener('click', () => {
        window.scrollTo({top:0,behavior:'smooth'});
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'PageDown' || event.key === 'ArrowDown') {
          event.preventDefault();
          window.scrollBy({top:window.innerHeight * .82,behavior:'smooth'});
        }
        if (event.key === 'PageUp' || event.key === 'ArrowUp') {
          event.preventDefault();
          window.scrollBy({top:-window.innerHeight * .82,behavior:'smooth'});
        }
        if (event.key === 'Home') {
          event.preventDefault();
          window.scrollTo({top:0,behavior:'smooth'});
        }
      });
    })();
  </script></body></html>
