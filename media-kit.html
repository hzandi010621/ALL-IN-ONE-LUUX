  </main><footer><img src="landing-luux-logo.png" alt="LUUX"><a href="#top" aria-label="맨 위로">↑</a></footer><div class="show" id="show" role="dialog" aria-modal="true" aria-label="제안서 전체화면" aria-hidden="true"><img id="showImg" alt=""><button class="show-prev" id="showPrev" type="button" aria-label="이전 장">←</button><button class="show-next" id="showNext" type="button" aria-label="다음 장">→</button><button class="show-close" id="showClose" type="button" aria-label="전체화면 닫기">✕</button><div class="show-bar"><b id="showNum">1</b>&nbsp;/&nbsp;<span id="showTotal">11</span></div></div><script>
    (() => {
      const pages = [...document.querySelectorAll('.page-wrap')];
      const progressBar = document.getElementById('progressBar');
      const updateProgress = () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
        progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
      };
      window.addEventListener('scroll', updateProgress, {passive:true});
      updateProgress();

      // 전체화면: 지금 보고 있는 장부터 한 장씩 넘겨 보기
      const show = document.getElementById('show');
      const showImg = document.getElementById('showImg');
      const showNum = document.getElementById('showNum');
      const srcs = pages.map(p => p.querySelector('img').getAttribute('src'));
      document.getElementById('showTotal').textContent = srcs.length;
      let index = 0;

      const visibleIndex = () => {
        const mid = window.innerHeight / 2;
        let best = 0, dist = Infinity;
        pages.forEach((p, i) => {
          const r = p.getBoundingClientRect();
          const d = Math.abs((r.top + r.bottom) / 2 - mid);
          if (d < dist) { dist = d; best = i; }
        });
        return best;
      };
      const go = (i) => {
        index = Math.max(0, Math.min(srcs.length - 1, i));
        showImg.src = srcs[index];
        showImg.alt = 'LUUX 매체소개서 ' + (index + 1) + '페이지';
        showNum.textContent = index + 1;
      };
      const isOpen = () => show.classList.contains('open');
      const open = () => {
        go(visibleIndex());
        show.classList.add('open');
        show.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        if (show.requestFullscreen) show.requestFullscreen().catch(() => {});
      };
      const close = () => {
        if (!isOpen()) return;
        show.classList.remove('open');
        show.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        pages[index].scrollIntoView({block:'center'});
      };
      document.getElementById('present').addEventListener('click', open);
      document.getElementById('showClose').addEventListener('click', close);
      document.getElementById('showPrev').addEventListener('click', (e) => { e.stopPropagation(); go(index - 1); });
      document.getElementById('showNext').addEventListener('click', (e) => { e.stopPropagation(); go(index + 1); });
      showImg.addEventListener('click', (e) => go(e.offsetX < showImg.clientWidth / 2 ? index - 1 : index + 1));
      document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) close(); });
      let touchX = null;
      show.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, {passive:true});
      show.addEventListener('touchend', (e) => {
        if (touchX === null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 40) go(dx < 0 ? index + 1 : index - 1);
        touchX = null;
      });
      document.addEventListener('keydown', (event) => {
        if (!isOpen()) return;
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(index + 1); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); go(index - 1); }
        else if (event.key === 'Home') { event.preventDefault(); go(0); }
        else if (event.key === 'End') { event.preventDefault(); go(srcs.length - 1); }
        else if (event.key === 'Escape') close();
        event.stopImmediatePropagation();
      }, true);

      document.addEventListener('keydown', (event) => {
        if (event.key === 'PageDown' || event.key === 'ArrowDown') {
          event.preventDefault();
          window.scrollBy({top:window.innerHeight * .82,behavior:'smooth'});
        }
        if (event.key === 'PageUp' || event.key === 'ArrowUp') {
          event.preventDefault();
          window.scrollBy({top:-window.innerHeight * .82,behavior:'smooth'});
        }
        if (event.key === 'Home') {
          event.preventDefault();
          window.scrollTo({top:0,behavior:'smooth'});
        }
      });
    })();
