<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LUUX Showcase — 산업별 광고 집행 사례와 이벤트 프로젝트를 아카이빙하는 쇼케이스 페이지" />
  <title>LUUX Showcase</title>

  <style>
    :root{
      --bg:#f5f5f2;
      --surface:#ffffff;
      --ink:#111111;
      --muted:#737373;
      --line:#deded8;
      --accent:#d8ff3e;
      --max:1240px;
      --radius-xl:28px;
      --radius-lg:20px;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;
      letter-spacing:-0.02em;
    }

    button{
      font:inherit;
      color:inherit;
    }

    .shell{
      width:min(calc(100% - 36px), var(--max));
      margin:0 auto;
    }

    /* Header */
    header{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(245,245,242,.9);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(17,17,17,.08);
    }

    .nav{
      min-height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:-0.04em;
    }

    .brand-mark{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:10px;
      background:#111;
      color:#fff;
      font-size:11px;
      letter-spacing:.06em;
    }

    .nav-label{
      color:#666;
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
    }

    /* Compact subpage masthead */
    .hero{
      padding:42px 0 18px;
    }

    .hero-card{
      position:relative;
      display:grid;
      grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);
      gap:48px;
      align-items:end;
      min-height:auto;
      padding:32px 0 34px;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      background:transparent;
      color:var(--ink);
    }

    .hero-card::before{
      content:"";
      position:absolute;
      left:0;
      top:-1px;
      width:72px;
      height:4px;
      background:var(--accent);
    }

    .hero-title{
      min-width:0;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#747474;
      font-size:11px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .eyebrow-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 1px rgba(17,17,17,.14);
    }

    h1{
      margin:14px 0 0;
      max-width:760px;
      font-size:clamp(40px,5vw,62px);
      line-height:.98;
      letter-spacing:-.055em;
      font-weight:900;
    }

    .hero-copy{
      max-width:520px;
      justify-self:end;
      margin:0 0 2px;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      text-align:right;
    }

    /* Showcase */
    .showcase{
      padding:8px 0 90px;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:24px;
      margin-bottom:34px;
    }

    .kicker{
      margin:0 0 8px;
      color:#7a7a7a;
      font-size:12px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    h2{
      margin:0;
      font-size:clamp(30px,4vw,46px);
      line-height:1.05;
      letter-spacing:-.05em;
    }

    .section-desc{
      max-width:470px;
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
      text-align:right;
    }

    /* Main tabs */
    .main-tabs{
      display:flex;
      gap:46px;
      border-bottom:1px solid var(--line);
    }

    .main-tab{
      position:relative;
      padding:0 0 18px;
      border:0;
      background:none;
      color:#9a9a9a;
      cursor:pointer;
      font-size:22px;
      font-weight:900;
      letter-spacing:-.035em;
    }

    .main-tab::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-1px;
      width:100%;
      height:3px;
      background:#111;
      transform:scaleX(0);
      transform-origin:left;
      transition:transform .22s ease;
    }

    .main-tab.active{
      color:#111;
    }

    .main-tab.active::after{
      transform:scaleX(1);
    }

    /* Industry filters */
    .filter-wrap{
      min-height:82px;
      display:flex;
      align-items:center;
      border-bottom:1px solid var(--line);
    }

    .industry-filters{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      padding:18px 0;
    }

    .filter-btn{
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      padding:10px 14px;
      cursor:pointer;
      color:#626262;
      font-size:13px;
      font-weight:700;
      transition:.18s ease;
    }

    .filter-btn:hover{
      border-color:#b6b6b0;
      color:#111;
    }

    .filter-btn.active{
      border-color:#111;
      background:#111;
      color:#fff;
    }

    .event-note{
      display:none;
      color:#777;
      font-size:13px;
    }

    body.event-mode .industry-filters{
      display:none;
    }

    body.event-mode .event-note{
      display:block;
    }

    /* Empty archive area */
    .archive-area{
      min-height:420px;
      padding:64px 0 0;
    }

    .archive-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px;
    }

    .placeholder-card{
      min-height:270px;
      padding:24px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      border:1px dashed #cfcfc8;
      border-radius:var(--radius-lg);
      background:rgba(255,255,255,.48);
    }

    .placeholder-number{
      margin-bottom:auto;
      color:#b1b1ac;
      font-size:11px;
      font-weight:900;
      letter-spacing:.09em;
    }

    .placeholder-card strong{
      font-size:18px;
      letter-spacing:-.035em;
    }

    .placeholder-card span{
      margin-top:6px;
      color:#929292;
      font-size:12px;
    }

    .archive-message{
      margin-top:26px;
      color:#7c7c7c;
      font-size:12px;
      text-align:center;
    }


    /* Dynamic showcase cards */
    .archive-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:22px;
    }
    .case-card{
      border:0;
      background:transparent;
      padding:0;
      text-align:left;
      cursor:pointer;
    }
    .case-thumb{
      position:relative;
      aspect-ratio:4/3;
      overflow:hidden;
      border-radius:18px;
      background:#e9e9e4;
      border:1px solid var(--line);
    }
    .case-thumb img{
      width:100%;height:100%;object-fit:cover;display:block;
      transition:transform .28s ease;
    }
    .case-card:hover .case-thumb img{transform:scale(1.025)}
    .case-thumb.no-image{
      display:grid;place-items:center;
      color:#9a9a95;
      font-size:12px;font-weight:800;letter-spacing:.08em;
    }
    .case-meta{padding:15px 3px 0}
    .case-kicker{
      color:#8a8a8a;
      font-size:10px;
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
    }
    .case-card h3{
      margin:7px 0 4px;
      font-size:20px;
      line-height:1.15;
      letter-spacing:-.04em;
    }
    .case-card p{
      margin:0;
      color:#777;
      font-size:13px;
      line-height:1.5;
    }
    .loading-state,
    .empty-state,
    .error-state{
      grid-column:1/-1;
      padding:80px 20px;
      text-align:center;
      border:1px dashed #cdcdc6;
      border-radius:20px;
      color:#818181;
      background:rgba(255,255,255,.45);
      font-size:13px;
    }
    .error-state strong{display:block;color:#111;margin-bottom:7px}

    /* Detail modal */
    .case-modal{
      position:fixed;inset:0;z-index:200;
      display:none;align-items:center;justify-content:center;
      padding:26px;
      background:rgba(10,10,10,.58);
      backdrop-filter:blur(10px);
    }
    .case-modal.open{display:flex}
    .case-dialog{
      width:min(100%,1020px);
      max-height:min(88vh,900px);
      overflow:auto;
      border-radius:24px;
      background:#fff;
      box-shadow:0 30px 100px rgba(0,0,0,.28);
    }
    .case-dialog-head{
      position:sticky;top:0;z-index:4;
      display:flex;justify-content:space-between;gap:20px;align-items:flex-start;
      padding:24px 26px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(14px);
    }
    .case-dialog-head small{
      color:#858585;font-size:10px;font-weight:900;letter-spacing:.11em;
    }
    .case-dialog-head h3{
      margin:7px 0 4px;
      font-size:28px;line-height:1.1;letter-spacing:-.05em;
    }
    .case-dialog-head p{margin:0;color:#777;font-size:13px}
    .modal-close{
      width:38px;height:38px;flex:0 0 auto;
      border:1px solid var(--line);border-radius:50%;
      background:#f4f4f1;cursor:pointer;font-size:18px;
    }
    .case-dialog-body{padding:24px 26px 30px}
    .case-description{margin:0 0 22px;color:#555;font-size:14px;line-height:1.75}
    .detail-images{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .detail-images img{
      display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);
    }

    @media(max-width:900px){
      .archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:580px){
      .archive-grid{grid-template-columns:1fr}
      .case-modal{padding:10px}
      .case-dialog{max-height:92vh;border-radius:18px}
      .case-dialog-head{padding:20px 18px 15px}
      .case-dialog-body{padding:18px}
      .detail-images{grid-template-columns:1fr}
    }

    footer{
      padding:30px 0 42px;
      border-top:1px solid var(--line);
      color:#777;
      font-size:12px;
    }

    .footer-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .footer-row strong{
      color:#111;
    }

    @media (max-width:900px){
      .hero-card{
        grid-template-columns:1fr;
        gap:18px;
        align-items:start;
        padding:28px 0 30px;
      }

      .hero-copy{
        justify-self:start;
        text-align:left;
      }

      .section-head{
        align-items:flex-start;
        flex-direction:column;
      }

      .section-desc{
        text-align:left;
      }

      .archive-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:580px){
      .shell{
        width:min(calc(100% - 22px), var(--max));
      }

      .hero{
        padding-top:24px;
      }

      .hero-card{
        padding:24px 0 26px;
      }

      h1{
        font-size:42px;
      }

      .main-tabs{
        gap:30px;
      }

      .main-tab{
        font-size:19px;
      }

      .archive-grid{
        grid-template-columns:1fr;
      }

      .footer-row{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="shell nav">
      <div class="brand">
        <div class="brand-mark">LUUX</div>
        <span>Showcase</span>
      </div>

      <div class="nav-label">SELECTED WORKS & EVENTS</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="shell">
        <div class="hero-card">
          <div class="hero-title">
            <div class="eyebrow">
              <span class="eyebrow-dot"></span>
              LUUX ARCHIVE
            </div>
            <h1>LUUX Showcase</h1>
          </div>

          <p class="hero-copy">
            LUUX에서 집행된 브랜드 광고 사례와 다양한 이벤트 프로젝트를 한 곳에서 확인합니다.
          </p>
        </div>
      </div>
    </section>

    <section class="showcase">
      <div class="shell">
        <div class="main-tabs" role="tablist" aria-label="아카이브 구분">
          <button class="main-tab active" type="button" data-tab="industry" role="tab" aria-selected="true">
            INDUSTRY
          </button>
          <button class="main-tab" type="button" data-tab="event" role="tab" aria-selected="false">
            EVENT
          </button>
        </div>

        <div class="filter-wrap">
          <div class="industry-filters" id="industryFilters" aria-label="산업 필터">
            <button class="filter-btn active" type="button" data-filter="ALL">ALL</button>
            <button class="filter-btn" type="button" data-filter="패션·뷰티">패션·뷰티</button>
            <button class="filter-btn" type="button" data-filter="금융">금융</button>
            <button class="filter-btn" type="button" data-filter="자동차">자동차</button>
            <button class="filter-btn" type="button" data-filter="식음료">식음료</button>
            <button class="filter-btn" type="button" data-filter="엔터테인먼트">엔터테인먼트</button>
            <button class="filter-btn" type="button" data-filter="공공·관광">공공·관광</button>
            <button class="filter-btn" type="button" data-filter="IT">IT</button>
          </div>

          <div class="event-note">
            LUUX의 라이브·행사·특별 프로젝트 사례가 이 영역에 표시됩니다.
          </div>
        </div>

        <div class="archive-area">
          <div class="archive-grid" id="archiveGrid">
            <div class="loading-state">Showcase 데이터를 불러오는 중입니다.</div>
          </div>

          <div class="archive-message" id="archiveMessage"></div>
        </div>
      </div>
    </section>
  </main>


  <div class="case-modal" id="caseModal" aria-hidden="true">
    <div class="case-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="case-dialog-head">
        <div>
          <small id="modalCategory"></small>
          <h3 id="modalTitle"></h3>
          <p id="modalSubtitle"></p>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="닫기">×</button>
      </div>
      <div class="case-dialog-body">
        <p class="case-description" id="modalDescription"></p>
        <div class="detail-images" id="detailImages"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="shell footer-row">
      <div>
        <strong>LUUX Showcase</strong><br>
        Selected Works & Events Archive
      </div>
      <div>Dong-A Ilbo · LUUX</div>
    </div>
  </footer>

  <script>
    (() => {
      /* ONE-TIME SETUP:
         Apps Script 배포 후 받은 /exec URL을 아래 한 줄에 붙여 넣으면 됩니다. */
      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzaORSKL4ZahxlJaB3DCK-_L7BLMOyx7MBg79TTYKQAHUb7h26EKRQzSDpbuDI2M0R8tg/exec';

      const tabs = [...document.querySelectorAll('.main-tab')];
      const filters = [...document.querySelectorAll('.filter-btn')];
      const grid = document.getElementById('archiveGrid');
      const message = document.getElementById('archiveMessage');
      const modal = document.getElementById('caseModal');
      const modalClose = document.getElementById('modalClose');
      const modalCategory = document.getElementById('modalCategory');
      const modalTitle = document.getElementById('modalTitle');
      const modalSubtitle = document.getElementById('modalSubtitle');
      const modalDescription = document.getElementById('modalDescription');
      const detailImages = document.getElementById('detailImages');

      let allCases = [];
      let currentTab = 'INDUSTRY';
      let currentIndustry = 'ALL';

      const escapeHtml = (value='') => String(value)
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#039;');

      function driveImageUrl(value){
        if(!value) return '';
        const text=String(value).trim();
        if(/^https?:\/\//i.test(text) && !text.includes('drive.google.com')) return text;
        const match=text.match(/[-\w]{20,}/);
        const id=match ? match[0] : text;
        if(!id) return '';
        return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`;
      }

      function visibleCases(){
        return allCases.filter(item => {
          if(item.type !== currentTab) return false;
          if(currentTab === 'INDUSTRY' && currentIndustry !== 'ALL' && item.industry !== currentIndustry) return false;
          return true;
        });
      }

      function render(){
        const list=visibleCases();
        if(!list.length){
          grid.innerHTML='<div class="empty-state">등록된 사례가 없습니다.</div>';
          message.textContent='';
          return;
        }

        grid.innerHTML=list.map((item,index)=>{
          const image=driveImageUrl(item.thumbnail);
          const category=item.type==='EVENT' ? 'EVENT' : (item.industry || 'INDUSTRY');
          const thumb=image
            ? `<div class="case-thumb"><img src="${escapeHtml(image)}" alt="${escapeHtml(item.title)}" loading="lazy"></div>`
            : `<div class="case-thumb no-image">IMAGE</div>`;
          return `<button class="case-card" type="button" data-id="${escapeHtml(item.id)}">
            ${thumb}
            <div class="case-meta">
              <div class="case-kicker">${escapeHtml(category)}</div>
              <h3>${escapeHtml(item.title)}</h3>
              <p>${escapeHtml(item.subtitle || '')}</p>
            </div>
          </button>`;
        }).join('');

        grid.querySelectorAll('.case-card').forEach(card=>{
          card.addEventListener('click',()=>openModal(card.dataset.id));
        });
        message.textContent=`${list.length} CASE${list.length>1?'S':''}`;
      }

      function openModal(id){
        const item=allCases.find(x=>String(x.id)===String(id));
        if(!item) return;
        modalCategory.textContent=item.type==='EVENT' ? 'EVENT' : (item.industry || 'INDUSTRY');
        modalTitle.textContent=item.title || '';
        modalSubtitle.textContent=item.subtitle || '';
        modalDescription.textContent=item.description || '';

        const imgs=[item.thumbnail,item.detail1,item.detail2]
          .map(driveImageUrl).filter(Boolean);
        detailImages.innerHTML=imgs.map((url,i)=>`<img src="${escapeHtml(url)}" alt="${escapeHtml(item.title)} ${i+1}" loading="lazy">`).join('');
        modalDescription.style.display=item.description ? 'block' : 'none';
        detailImages.style.display=imgs.length ? 'grid' : 'none';
        modal.classList.add('open');
        modal.setAttribute('aria-hidden','false');
        document.body.style.overflow='hidden';
      }

      function closeModal(){
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden','true');
        document.body.style.overflow='';
      }

      tabs.forEach(tab=>{
        tab.addEventListener('click',()=>{
          tabs.forEach(t=>{t.classList.remove('active');t.setAttribute('aria-selected','false')});
          tab.classList.add('active');
          tab.setAttribute('aria-selected','true');
          currentTab=tab.dataset.tab.toUpperCase();
          document.body.classList.toggle('event-mode',currentTab==='EVENT');
          if(currentTab==='INDUSTRY'){
            currentIndustry='ALL';
            filters.forEach(f=>f.classList.remove('active'));
            filters[0].classList.add('active');
          }
          render();
        });
      });

      filters.forEach(filter=>{
        filter.addEventListener('click',()=>{
          filters.forEach(f=>f.classList.remove('active'));
          filter.classList.add('active');
          currentIndustry=filter.dataset.filter;
          render();
        });
      });

      modalClose.addEventListener('click',closeModal);
      modal.addEventListener('click',e=>{if(e.target===modal) closeModal()});
      document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal()});

      window.loadLuuxShowcase = function(payload){
        if(!payload || payload.ok===false){
          grid.innerHTML='<div class="error-state"><strong>데이터를 불러오지 못했습니다.</strong>Apps Script 설정을 확인해주세요.</div>';
          return;
        }
        allCases=Array.isArray(payload.items) ? payload.items : [];
        render();
      };

      function loadData(){
        if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_')){
          grid.innerHTML='<div class="error-state"><strong>최초 연동 설정이 필요합니다.</strong>Apps Script 웹앱 URL을 showcase.html의 APPS_SCRIPT_URL에 한 번만 입력해주세요.</div>';
          return;
        }
        const script=document.createElement('script');
        const sep=APPS_SCRIPT_URL.includes('?') ? '&' : '?';
        script.src=`${APPS_SCRIPT_URL}${sep}callback=loadLuuxShowcase&_=${Date.now()}`;
        script.onerror=()=>{
          grid.innerHTML='<div class="error-state"><strong>데이터 연결 실패</strong>웹앱 배포 권한과 URL을 확인해주세요.</div>';
        };
        document.body.appendChild(script);
      }

      loadData();
    })();
  </script>
</body>
</html>
